name: Build iOS app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ios-build.yml"
      - "alabiq-web-main/mobile/**"
      - "alabiq-web-main/resources/**"
      - "alabiq-web-main/package.json"
      - "alabiq-web-main/package-lock.json"
      - "alabiq-web-main/vite.config.js"
  push:
    branches:
      - full
      - main
      - master
    paths:
      - ".github/workflows/ios-build.yml"
      - "alabiq-web-main/mobile/**"
      - "alabiq-web-main/resources/**"
      - "alabiq-web-main/package.json"
      - "alabiq-web-main/package-lock.json"
      - "alabiq-web-main/vite.config.js"

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-simulator:
    name: iOS Simulator (unsigned)
    runs-on: macos-26
    timeout-minutes: 30

    defaults:
      run:
        working-directory: alabiq-web-main/mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            alabiq-web-main/package-lock.json
            alabiq-web-main/mobile/package-lock.json

      - name: Show Apple toolchain
        run: xcodebuild -version

      # Web assets come from the Laravel app's Vite build (alabiq-web-main
      # root). capacitor.config.json webDir = ../public/build.
      - name: Install web (Laravel Vite) dependencies
        working-directory: alabiq-web-main
        run: npm ci

      - name: Install Capacitor shell dependencies
        run: npm ci

      - name: Build web app and sync Capacitor
        run: |
          npm --prefix .. run build
          npx cap sync ios

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -resolvePackageDependencies

      - name: Build unsigned iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          app_path="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" \
            "$RUNNER_TEMP/Alabiq-iOS-Simulator.zip"

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Alabiq-iOS-Simulator-${{ github.sha }}
          path: ${{ runner.temp }}/Alabiq-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
