openapi: 3.1.0
info:
  title: Alabiq Partner Delivery API
  version: 1.0.0-draft
  description: |
    Delivery-as-a-service API for restaurant-owned websites and PWAs.
    Restaurants order and collect payment on their own channels, then call
    Alabiq to dispatch a rider.
  contact:
    name: Alabiq Platform
    url: https://alabiq.com
    email: support@alabiq.com
servers:
  - url: https://api.alabiq.com
    description: Production
  - url: http://localhost:4001
    description: Local development (Docker)
security:
  - PartnerAuth: []
paths:
  /delivery-quotes:
    post:
      summary: Price a delivery for the authenticated branch and drop-off
      operationId: createQuote
      tags: [Quotes]
      security:
        - PartnerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '201':
          description: Quote created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /deliveries:
    post:
      summary: Create an already accepted, externally paid restaurant order and request dispatch
      operationId: createDelivery
      tags: [Deliveries]
      security:
        - PartnerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryCreateRequest'
      responses:
        '201':
          description: Delivery created and dispatch started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryCreateResponse'
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
              description: 'True if this response was replayed from a prior identical request'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /deliveries/{id}:
    get:
      summary: Read current delivery state for the authenticated branch only
      operationId: getDelivery
      tags: [Deliveries]
      security:
        - PartnerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
      responses:
        '200':
          description: Delivery state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryStateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /deliveries/{id}/cancel:
    post:
      summary: Cancel before pickup, subject to state rules
      operationId: cancelDelivery
      tags: [Deliveries]
      security:
        - PartnerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          description: Delivery cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /deliveries/{id}/preparation:
    post:
      summary: Optional update: preparing or ready; never dispatches twice
      operationId: updatePreparation
      tags: [Deliveries]
      security:
        - PartnerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreparationRequest'
      responses:
        '200':
          description: Preparation status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparationResponse'
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /deliveries/{id}/tracking-token/rotate:
    post:
      summary: Optional but recommended if a tracking URL leaks; revokes the old token
      operationId: rotateTrackingToken
      tags: [Deliveries]
      security:
        - PartnerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Tracking token rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingTokenRotateResponse'
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    PartnerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIKey
      description: |
        Authorization: Bearer ak_live_<credential-id>.<high-entropy-secret>
        The credential ID prefix (ak_live_...) is used for lookup; the secret is verified
        against a keyed hash. Never log the full bearer token.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Restaurant-generated unique value (64-128 characters). Used for exactly-once
        creation semantics. Same key + same body = replay original result.
        Same key + different body = 409 idempotency_conflict.
      schema:
        type: string
        minLength: 64
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]+$'
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      description: Restaurant request correlation ID for debugging and support
      schema:
        type: string
        maxLength: 64
    DeliveryId:
      name: id
      in: path
      required: true
      description: Alabiq delivery UUID
      schema:
        type: string
        format: uuid

  schemas:
    QuoteRequest:
      type: object
      required: [external_order_id, dropoff]
      properties:
        external_order_id:
          type: string
          minLength: 1
          maxLength: 100
          description: Restaurant's internal order reference (unique within the branch)
        dropoff:
          $ref: '#/components/schemas/LocationInput'
      additionalProperties: false

    QuoteResponse:
      type: object
      required: [quote_id, external_order_id, currency, delivery_fee_minor, expires_at]
      properties:
        quote_id:
          type: string
          format: uuid
          description: Quote identifier (opaque)
        external_order_id:
          type: string
        currency:
          type: string
          enum: [SAR]
        delivery_fee_minor:
          type: integer
          minimum: 0
          description: Delivery fee in minor units (halalas, 1 SAR = 100 halalas)
        expires_at:
          type: string
          format: date-time
          description: Quote expiry (default 10 minutes)
      additionalProperties: false

    LocationInput:
      type: object
      required: [lat, lng, address]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        address:
          type: string
          minLength: 1
          maxLength: 500
        instructions:
          type: string
          maxLength: 500
          nullable: true
      additionalProperties: false

    DeliveryCreateRequest:
      type: object
      required: [external_order_id, quote_id, customer, dropoff, items, merchandise_total, external_payment, preparation_status]
      properties:
        external_order_id:
          type: string
          minLength: 1
          maxLength: 100
        quote_id:
          type: string
          format: uuid
        customer:
          $ref: '#/components/schemas/CustomerInput'
        dropoff:
          $ref: '#/components/schemas/LocationInput'
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/ItemSnapshot'
        merchandise_total:
          $ref: '#/components/schemas/AmountMinor'
        external_payment:
          $ref: '#/components/schemas/ExternalPayment'
        preparation_status:
          type: string
          enum: [accepted]
          description: MVP requires 'accepted' (restaurant has confirmed and will prepare)
      additionalProperties: false

    CustomerInput:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          pattern: '^\\+9665\\d{8}$'
          description: Saudi mobile in E.164 format (+9665XXXXXXXX)
      additionalProperties: false

    ItemSnapshot:
      type: object
      required: [name, quantity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        quantity:
          type: integer
          minimum: 1
          maximum: 100
      additionalProperties: false

    AmountMinor:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          minimum: 0
        currency:
          type: string
          enum: [SAR]
      additionalProperties: false

    ExternalPayment:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [paid]
          description: MVP only accepts 'paid' - restaurant has already collected payment
        reference:
          type: string
          maxLength: 120
          description: Restaurant's payment reference for reconciliation
      additionalProperties: false

    DeliveryCreateResponse:
      type: object
      required: [delivery_id, order_id, external_order_id, status, delivery_fee, tracking_url, created_at]
      properties:
        delivery_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        external_order_id:
          type: string
        status:
          type: string
          enum: [searching]
        delivery_fee:
          $ref: '#/components/schemas/AmountMinor'
        tracking_url:
          type: string
          format: uri
          description: Guest tracking URL with unguessable token
        created_at:
          type: string
          format: date-time
      additionalProperties: false

    DeliveryStateResponse:
      type: object
      required: [delivery_id, order_id, external_order_id, status, substatus, delivery_fee, timestamps]
      properties:
        delivery_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        external_order_id:
          type: string
        status:
          type: string
          enum: [searching, assigned, picked_up, delivered, cancelled]
        substatus:
          type: string
          nullable: true
          description: Detail within status (e.g., 'no_riders', 'search_exhausted')
        delivery_fee:
          $ref: '#/components/schemas/AmountMinor'
        timestamps:
          $ref: '#/components/schemas/DeliveryTimestamps'
        pickup:
          $ref: '#/components/schemas/LocationSnapshot'
        dropoff:
          $ref: '#/components/schemas/LocationSnapshot'
        rider:
          $ref: '#/components/schemas/RiderSnapshot'
        cancellation_reason:
          type: string
          nullable: true
      additionalProperties: false

    DeliveryTimestamps:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        assigned_at:
          type: string
          format: date-time
          nullable: true
        picked_up_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false

    LocationSnapshot:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
        address:
          type: string
        instructions:
          type: string
          nullable: true
      additionalProperties: false

    RiderSnapshot:
      type: object
      nullable: true
      properties:
        name:
          type: string
        vehicle_type:
          type: string
        vehicle_plate:
          type: string
        phone:
          type: string
        whatsapp:
          type: string
        location:
          $ref: '#/components/schemas/LocationSnapshot'
      additionalProperties: false

    CancelRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 300
      additionalProperties: false

    CancelResponse:
      type: object
      required: [delivery_id, status, cancelled_at]
      properties:
        delivery_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [cancelled]
        cancelled_at:
          type: string
          format: date-time
      additionalProperties: false

    PreparationRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [preparing, ready]
      additionalProperties: false

    PreparationResponse:
      type: object
      required: [delivery_id, status, preparation_status, updated_at]
      properties:
        delivery_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [searching, assigned]
        preparation_status:
          type: string
          enum: [preparing, ready]
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    TrackingTokenRotateResponse:
      type: object
      required: [delivery_id, tracking_url]
      properties:
        delivery_id:
          type: string
          format: uuid
        tracking_url:
          type: string
          format: uri
      additionalProperties: false

  responses:
    BadRequest:
      description: Invalid request body or headers
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    Unauthorized:
      description: Invalid, revoked, or missing API credential
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    Forbidden:
      description: Credential valid but restaurant suspended or accessing another tenant's delivery
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    NotFound:
      description: Delivery not found (or belongs to another tenant - returns 404 to prevent enumeration)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    Conflict:
      description: |
        Idempotency conflict (same key, different body), external_order_id already exists,
        quote expired/consumed/mismatch, or state transition not allowed (e.g., cancel after pickup)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    UnprocessableEntity:
      description: Validation failure (outside service area, min order, malformed coordinates, etc.)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until next allowed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    ServiceUnavailable:
      description: Database unavailable or transient failure
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until retry suggested
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  ErrorEnvelope:
    type: object
    required: [error]
    properties:
      error:
        type: object
        required: [code, message, request_id]
        properties:
          code:
            type: string
            enum: [invalid_request, unauthorized, restaurant_suspended, outside_service_area, quote_expired, quote_mismatch, quote_already_used, idempotency_conflict, external_order_exists, request_in_progress, not_found, invalid_state, cancellation_not_allowed, rate_limited, service_unavailable]
          message:
            type: string
          request_id:
            type: string
            description: Server-generated request ID for support correlation
        additionalProperties: false
