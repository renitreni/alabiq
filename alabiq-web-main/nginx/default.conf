# Alabiq web edge — serves the Laravel app (Blade web + /api/*) from the web
# container, proxying PHP to the app service (php-fpm :9000).
# SSE-safe handling for /api/events is kept (driver dispatch depends on it).

server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 25m;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Vite-built assets (Phase 3 Blade port) — long-cache immutable fingerprints
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SSE endpoint — disable all buffering
    location = /api/events {
        try_files $uri $uri/ /index.php?$query_string;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
        fastcgi_buffering off;
        fastcgi_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        fastcgi_read_timeout 75s;
        fastcgi_send_timeout 75s;
    }

    # Main PHP handler
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # Web + API catch-all → Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Deny access to hidden files
    location ~ /\.(?!well-known) {
        deny all;
    }
}
