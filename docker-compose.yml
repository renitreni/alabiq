# Alabiq — full-Laravel stack.
# Replaces the former Node api/worker/migrate/seed services, React frontend
# container, and Node realtime SSE service (see archive/full-laravel-migration/
# and PLAN-full-laravel.md). Realtime is pusher.com (BROADCAST_CONNECTION=pusher).
#
# Services: postgres, redis, minio, migrate + seed-reference (one-shot artisan),
# app (php-fpm), web (nginx), queue-worker, scheduler.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alabiq}
      POSTGRES_USER: ${POSTGRES_USER:-alabiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:-alabiq_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [app]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [app]

  minio:
    image: ghcr.io/librefs/librefs:latest
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-alabiq}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - object_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-lc", "</dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [app]

  migrate:
    build: .
    command: ["php", "artisan", "migrate", "--force"]
    env_file:
      - path: ./.env
        required: false
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-alabiq}
      DB_USERNAME: ${POSTGRES_USER:-alabiq}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]

  seed-reference:
    build: .
    command: ["php", "artisan", "db:seed", "--class=ReferenceDataSeeder", "--force"]
    env_file:
      - path: ./.env
        required: false
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-alabiq}
      DB_USERNAME: ${POSTGRES_USER:-alabiq}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [app]

  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment: &laravel-app-env
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:${WEB_PORT:-8080}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-alabiq}
      DB_USERNAME: ${APP_DB_USER:-alabiq_app}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: null
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: file
      BROADCAST_CONNECTION: pusher
      AWS_ENDPOINT: http://minio:9000
      AWS_BUCKET: ${MINIO_BUCKET:-alabiq-media}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-alabiq}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      PARTNER_API_ENABLED: "true"
      WORKER_ENABLED: "true"
      LEGACY_FOOD_MARKETPLACE_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed-reference:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    expose: ["9000"]
    networks: [app]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "php", "artisan", "health:check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
      # Host-side alias for the prod nginx upstream (DEPLOYMENT-PLAN.md §5).
      - "127.0.0.1:4001:8080"
    networks: [app]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  queue-worker:
    build: .
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment: *laravel-app-env
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [app]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "php", "artisan", "health:check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  scheduler:
    build: .
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment: *laravel-app-env
    depends_on:
      app:
        condition: service_healthy
    networks: [app]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

volumes:
  postgres_data:
  redis_data:
  object_data:

networks:
  app:
    driver: bridge
